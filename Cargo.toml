[package]
name = "rust-rpico2-embassy-examples"
version = "0.2.0"
edition = "2024"

[dependencies]
# Cortex-M 
cortex-m = "0.7.7"
cortex-m-rt = "0.7.5"

# Panic Handler
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

# Embassy
embassy-executor = { version = "0.9", features = [
  "arch-cortex-m",
  "executor-thread",
  "defmt",
] }
embassy-time = { version = "0.5.0" }
embassy-rp = { version = "0.9.0", features = [
  "time-driver",
  "critical-section-impl",
  "rp235xa",
  "binary-info",
  "defmt",
] }

# Defmt Logging
defmt = "1.0.1"
defmt-rtt = "1.1.0"

[dev-dependencies]
adxl345-eh-driver = "0.2.2"
hs3003 = { version = "0.2.0", features = ["async"] }
libm = "0.2.16"
lcd-async = "0.1.3"
tinybmp = "0.7.0"
embedded-graphics = "0.8.2"
embedded-hal-bus = { version = "0.3.0", features = ["async"] }
embedded-hal-async = "1.0.0"
onewire = { version = "0.4.0", features = ["defmt", "defmt-debug2format"] }
embedded-hal = "1.0.0"

[profile.dev]
opt-level = 2
debug = true

[profile.release]
opt-level = 3
lto = true
debug = false


